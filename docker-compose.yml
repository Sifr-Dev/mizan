services:
  postgres:
    image: postgres:16-alpine
    container_name: clean-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-clean_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clean-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clean-api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations:ro

  # Frontend dev server (hot-reload with Vite).
  frontend-dev:
    image: node:22-alpine
    container_name: clean-frontend-dev
    command: sh -c "npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0 --port 3000"
    working_dir: /app/frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - api
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  pgdata:
  redisdata:
